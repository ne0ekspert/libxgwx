[package]
name = "libxgwx-dev-tools"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[dependencies]
xgwx = { package = "libxgwx", path = ".." }
base64 = "0.22"
roxmltree = "0.20"
bzip2 = { version = "0.5", default-features = false, features = ["libbz2-rs-sys"] }

[features]
default = ["write", "il"]
write = ["xgwx/write"]
il = ["xgwx/il"]

